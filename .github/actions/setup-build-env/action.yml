name: 'Setup Build Environment'
description: 'Common setup for Rust builds with all required packages (Linux & macOS)'
runs:
  using: 'composite'
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup update stable
        rustup default stable
        rustup component add rustfmt clippy

    - name: Cache Cargo dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install packages (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Tapping validates formulae, so trust this existing dependency tap first.
        brew trust --tap slp/krun
        brew tap slp/krun
        brew install virglrenderer llvm

    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libvirglrenderer-dev \
          libepoxy-dev \
          libdrm-dev \
          libpipewire-0.3-dev \
          clang-format \
          libclang-dev \
          libcap-ng-dev
